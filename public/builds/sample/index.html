<!doctype html>
<!-- SAMPLE web build, standing in for a Unity or Godot web export. Delete the folder when you add your own. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sample web build</title>
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; background: #24331f; }
      canvas { display: block; width: 100%; height: 100%; }
      p { position: fixed; left: 12px; bottom: 10px; margin: 0; color: #dbe7cf; font: 13px system-ui, sans-serif; opacity: 0.85; }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <p>Move with arrow keys or WASD. Click to plant moss.</p>
    <script>
      const canvas = document.querySelector('canvas');
      const ctx = canvas.getContext('2d');
      const keys = new Set();
      const moss = [];
      const golem = { x: 0.5, y: 0.6 };

      addEventListener('keydown', (e) => {
        keys.add(e.key.toLowerCase());
        if (e.key.startsWith('Arrow')) e.preventDefault();
      });
      addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
      canvas.addEventListener('pointerdown', (e) => {
        moss.push({ x: e.offsetX / canvas.clientWidth, y: e.offsetY / canvas.clientHeight, r: 0 });
      });

      const held = (...names) => names.some((n) => keys.has(n));
      let last = performance.now();

      function frame(now) {
        const dt = Math.min((now - last) / 1000, 0.05);
        last = now;
        const w = (canvas.width = canvas.clientWidth * devicePixelRatio);
        const h = (canvas.height = canvas.clientHeight * devicePixelRatio);
        const unit = Math.min(w, h);

        golem.x += (held('arrowright', 'd') - held('arrowleft', 'a')) * 0.4 * dt;
        golem.y += (held('arrowdown', 's') - held('arrowup', 'w')) * 0.4 * dt;
        golem.x = Math.min(Math.max(golem.x, 0.05), 0.95);
        golem.y = Math.min(Math.max(golem.y, 0.1), 0.95);

        ctx.fillStyle = '#24331f';
        ctx.fillRect(0, 0, w, h);

        for (const m of moss) {
          m.r = Math.min(m.r + dt * 0.03, 0.05);
          const near = Math.hypot((m.x - golem.x) * w, (m.y - golem.y) * h) < unit * 0.1;
          ctx.fillStyle = near ? '#a7d67f' : '#6c9a4c';
          ctx.beginPath();
          ctx.arc(m.x * w, m.y * h, m.r * unit, 0, Math.PI * 2);
          ctx.fill();
        }

        const s = unit * 0.07;
        const gx = golem.x * w - s / 2;
        const gy = golem.y * h - s;
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.fillRect(gx + s * 0.1, gy + s * 0.95, s * 0.8, s * 0.12);
        ctx.fillStyle = '#9a9c95';
        ctx.fillRect(gx, gy, s, s);
        ctx.fillStyle = '#6c9a4c';
        ctx.fillRect(gx, gy, s, s * 0.25);
        ctx.fillStyle = '#24331f';
        ctx.fillRect(gx + s * 0.25, gy + s * 0.45, s * 0.12, s * 0.12);
        ctx.fillRect(gx + s * 0.63, gy + s * 0.45, s * 0.12, s * 0.12);

        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
